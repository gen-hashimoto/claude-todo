<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>TODO</h1>

    <form id="todo-form" class="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="やることを入力..."
        autocomplete="off"
        maxlength="200"
      >
      <button type="submit">追加</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="tablist">
        <button class="filter-btn active" data-filter="all">すべて</button>
        <button class="filter-btn" data-filter="active">未完了</button>
        <button class="filter-btn" data-filter="completed">完了済み</button>
      </div>
      <button id="clear-completed" class="clear-btn">完了済みを削除</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>タスクはありません</p>

    <div class="footer">
      <span id="count">0 件残り</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
